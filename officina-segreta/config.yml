backend:
  name: github
  repo: danodani/MotoItaly
  branch: main
  base_url: https://motoitaly.pages.dev
  auth_endpoint: /api/accesso-officina/9d4k2m

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

locale: "it"

# Link "torna al sito" nell'header del CMS (STEP 6)
display_url: "https://motoitaly.pages.dev"

collections:
  # ============ IL BAR DEL MOTOCICLISTA (BLOG) ============
  - name: "bar"
    label: "☕ Il Bar del Motociclista"
    label_singular: "Post da Bar"
    folder: "content/bar"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    sort: "date:desc"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      # STEP 5: lo slug resta modificabile ma suggerisce il titolo;
      # Sveltia non supporta suffissi progressivi automatici (-2, -3):
      # se il file esiste già, modificare lo slug a mano.
      - { label: "Slug (URL)", name: "slug", widget: "string", hint: "Suggerimento: usa lo stesso testo del titolo in minuscolo, con trattini al posto degli spazi (es. la-mia-guida). Se esiste già, aggiungi -2, -3." }
      - { label: "Data di pubblicazione", name: "date", widget: "datetime" }
      - label: "Categoria"
        name: "category"
        widget: "select"
        options:
          - { label: "Wiki & Guide", value: "wiki" }
          - { label: "Blog / Da Bar", value: "bar" }
        default: "bar"
      - { label: "Autore", name: "author", widget: "string", default: "Redazione Moto Italy" }
      - { label: "Immagine di copertina", name: "featured_image", widget: "image", required: false }
      - { label: "Estratto", name: "excerpt", widget: "text" }
      # STEP 3: campo libero; la lista dei tag già usati è in content/tags.json
      # (mantenuta a mano). Sveltia usa widget list: i suggerimenti automatici
      # via relation richiederebbero una collection di tag inesistente.
      - { label: "Tags", name: "tags", widget: "list", required: false, default: [], hint: "Premi Invio per aggiungere un tag. Tag già usati (per coerenza): vedi content/tags.json — dopo 2-3 caratteri ricontrolla di non creare duplicati." }
      - { label: "Contiene link di affiliazione?", name: "affiliate_links_present", widget: "boolean", default: false }
      - { label: "File GPX/KML (opzionale)", name: "gpx_file", widget: "file", required: false }
      - { label: "Contenuto", name: "body", widget: "markdown" }

  # ============ WIKI & GUIDE ============
  - name: "wiki"
    label: "📚 Wiki & Guide"
    label_singular: "Guida Wiki"
    folder: "content/wiki"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    sort: "date:desc"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      # STEP 5: vedi nota sulla collection "bar" (niente -2/-3 automatici).
      - { label: "Slug (URL)", name: "slug", widget: "string", hint: "Suggerimento: usa lo stesso testo del titolo in minuscolo, con trattini al posto degli spazi (es. la-mia-guida). Se esiste già, aggiungi -2, -3." }
      - { label: "Data di pubblicazione", name: "date", widget: "datetime" }
      - label: "Sezione (wiki/blog)"
        name: "category"
        widget: "select"
        options:
          - { label: "Wiki & Guide", value: "wiki" }
          - { label: "Blog / Da Bar", value: "bar" }
        default: "wiki"
      - label: "Categoria"
        name: "categoria"
        widget: "select"
        default: "neofiti"
        options:
          - { label: "📖 Guide per Neofiti", value: "neofiti" }
          - { label: "🔧 Manutenzione e Riparazioni", value: "manutenzione" }
          - { label: "📜 Normative e Burocrazia", value: "normative" }
          - { label: "🛡️ Sicurezza e Abbigliamento", value: "sicurezza" }
          - { label: "🗺️ Viaggi e Itinerari", value: "viaggi" }
          - { label: "❓ FAQ", value: "faq" }
      - { label: "Autore", name: "author", widget: "string", default: "Redazione Moto Italy" }
      - { label: "Immagine di copertina", name: "featured_image", widget: "image", required: false }
      - { label: "Estratto", name: "excerpt", widget: "text" }
      - { label: "Tags", name: "tags", widget: "list", required: false, default: [], hint: "Premi Invio per aggiungere un tag. Tag già usati (per coerenza): vedi content/tags.json — dopo 2-3 caratteri ricontrolla di non creare duplicati. Servono agli articoli correlati." }
      - { label: "Contiene link di affiliazione?", name: "affiliate_links_present", widget: "boolean", default: false }
      - { label: "File GPX/KML (opzionale)", name: "gpx_file", widget: "file", required: false }
      - { label: "Contenuto", name: "body", widget: "markdown" }