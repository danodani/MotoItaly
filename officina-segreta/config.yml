backend:
  name: github
  repo: danodani/MotoItaly
  branch: main
  base_url: https://motoitaly.pages.dev
  auth_endpoint: /api/accesso-officina/9d4k2m

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

locale: "it"

collections:
  # ============ IL BAR DEL MOTOCICLISTA (BLOG) ============
  - name: "bar"
    label: "☕ Il Bar del Motociclista"
    label_singular: "Post da Bar"
    folder: "content/bar"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    sort: "date:desc"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Slug (URL)", name: "slug", widget: "string" }
      - { label: "Data di pubblicazione", name: "date", widget: "datetime" }
      - label: "Categoria"
        name: "category"
        widget: "select"
        options:
          - { label: "Wiki / Normative", value: "wiki" }
          - { label: "Blog / Da Bar", value: "bar" }
        default: "bar"
      - { label: "Autore", name: "author", widget: "string", default: "Redazione Moto Italy" }
      - { label: "Immagine di copertina", name: "featured_image", widget: "image", required: false }
      - { label: "Estratto", name: "excerpt", widget: "text" }
      - { label: "Tags", name: "tags", widget: "list", required: false, hint: "Tag liberi, uno per riga (es. blog, test). Servono agli articoli correlati." }
      - { label: "Contiene link di affiliazione?", name: "affiliate_links_present", widget: "boolean", default: false }
      - { label: "File GPX/KML (opzionale)", name: "gpx_file", widget: "file", required: false }
      - { label: "Contenuto", name: "body", widget: "markdown" }

  # ============ WIKI / GUIDE E NORMATIVE ============
  - name: "wiki"
    label: "📚 Wiki / Guide e Normative"
    label_singular: "Guida Wiki"
    folder: "content/wiki"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    sort: "date:desc"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Slug (URL)", name: "slug", widget: "string" }
      - { label: "Data di pubblicazione", name: "date", widget: "datetime" }
      - label: "Sezione (wiki/blog)"
        name: "category"
        widget: "select"
        options:
          - { label: "Wiki / Normative", value: "wiki" }
          - { label: "Blog / Da Bar", value: "bar" }
        default: "wiki"
      - label: "Categoria"
        name: "categoria"
        widget: "select"
        default: "neofiti"
        options:
          - { label: "📖 Guide per Neofiti", value: "neofiti" }
          - { label: "🔧 Manutenzione e Riparazioni", value: "manutenzione" }
          - { label: "📜 Normative e Burocrazia", value: "normative" }
          - { label: "🛡️ Sicurezza e Abbigliamento", value: "sicurezza" }
          - { label: "🗺️ Viaggi e Itinerari", value: "viaggi" }
          - { label: "❓ FAQ", value: "faq" }
      - { label: "Autore", name: "author", widget: "string", default: "Redazione Moto Italy" }
      - { label: "Immagine di copertina", name: "featured_image", widget: "image", required: false }
      - { label: "Estratto", name: "excerpt", widget: "text" }
      - { label: "Tags", name: "tags", widget: "list", required: false, hint: "Tag liberi, uno per riga (es. primi-passi, casco, olio). Servono agli articoli correlati." }
      - { label: "Contiene link di affiliazione?", name: "affiliate_links_present", widget: "boolean", default: false }
      - { label: "File GPX/KML (opzionale)", name: "gpx_file", widget: "file", required: false }
      - { label: "Contenuto", name: "body", widget: "markdown" }